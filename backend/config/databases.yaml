# 多数据库连接配置
# 支持 ${VAR:default} 占位符从环境变量注入敏感信息

connections:
  - name: qa_pg
    label: "QA 环境 PostgreSQL"
    type: postgresql
    host: ${QA_DB_HOST:localhost}
    port: ${QA_DB_PORT:5432}
    database: ${QA_DB_NAME:charging_qa}
    username: ${QA_DB_USER:reader}
    password: ${QA_DB_PASSWORD:}
    ssl_mode: prefer
    pool:
      min_size: 2
      max_size: 10
      idle_timeout: 300

  - name: prod_pg
    label: "PROD 环境 PostgreSQL"
    type: postgresql
    host: ${PROD_DB_HOST:localhost}
    port: ${PROD_DB_PORT:5432}
    database: ${PROD_DB_NAME:charging_prod}
    username: ${PROD_DB_USER:readonly}
    password: ${PROD_DB_PASSWORD:}
    ssl_mode: require
    pool:
      min_size: 1
      max_size: 5
      idle_timeout: 60
    readonly: true
    query_timeout: 30

  - name: dev_pg
    label: "本地开发 PostgreSQL"
    type: postgresql
    host: ${DEV_DB_HOST:postgres-dev}
    port: ${DEV_DB_PORT:5432}
    database: ${DEV_DB_NAME:charging_dev}
    username: ${DEV_DB_USER:devuser}
    password: ${DEV_DB_PASSWORD:devpass}
    ssl_mode: disable
    pool:
      min_size: 1
      max_size: 5
      idle_timeout: 60
