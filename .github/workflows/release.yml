name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          $env:VITE_ELECTRON_BUILD = 'true'
          npm run build
          cd ..

      - name: Install build dependencies
        run: pip install -r scripts/requirements-installer.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Build backend (aiquery-backend.exe)
        run: python -m PyInstaller scripts/backend.spec --distpath dist --workpath dist/build/backend --noconfirm --clean

      - name: Set release version in Electron package.json
        run: |
          cd electron
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ steps.version.outputs.version }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8
          cd ..

      - name: Build Electron installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          New-Item -ItemType Directory -Force -Path electron/dist
          Copy-Item -Recurse -Force frontend/dist/* electron/dist/
          cd electron
          npm install --no-audit --no-fund
          npx electron-builder --win
          cd ..

      - name: Find installer file
        id: finder
        run: |
          $file = Get-ChildItem -Path dist -Filter "AI DB Query Setup*.exe" | Select-Object -First 1
          if (-not $file) {
            Write-Error "Installer not found"
            exit 1
          }
          echo "installer=$($file.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI DB Query v${{ steps.version.outputs.version }}
          files: dist/${{ steps.finder.outputs.installer }}
          generate_release_notes: true
